<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Log in to your GOO account.">
  <meta name="theme-color" content="#020611">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="application-name" content="GOO">
  <meta name="apple-mobile-web-app-title" content="GOO">
  <meta property="og:title" content="GOO">
  <meta property="og:image" content="icon-512.png">
  <meta name="twitter:title" content="GOO">
  <meta name="twitter:image" content="icon-512.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Log In - GOO</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: white;
      font-family: 'Segoe UI', Arial, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      background:
        radial-gradient(circle at top, rgba(255,255,255,0.08), transparent 25%),
        linear-gradient(180deg,#020611 0%,#071320 40%,#071a29 100%);
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at center, rgba(120,255,120,0.08), transparent 40%),
        repeating-radial-gradient(circle at 50% -20%, rgba(255,255,255,0.03) 0px, transparent 80px, transparent 120px);
      pointer-events: none;
      z-index: -1;
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
      background-size: 80px 80px;
      opacity: 0.2;
      pointer-events: none;
      z-index: -1;
    }
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      background: rgba(0,0,0,0.72);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,255,255,0.12);
    }
    .logo {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      text-transform: uppercase;
      line-height: 1;
    }
    .logo span { color: #c7ff38; }
    header nav a {
      color: rgba(255,255,255,0.85);
      text-decoration: none;
      font-size: 15px;
      font-weight: 700;
    }
    header nav a:hover { color: #fff; }
    .auth-overlay {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 100px 20px 40px;
    }
    .whiteboard-login {
      width: 100%;
      max-width: 420px;
      background:
        radial-gradient(circle at 18% 0%, rgba(199,255,56,0.12), transparent 55%),
        linear-gradient(180deg, #101b2d 0%, #0a1220 100%);
      padding: 40px;
      border-radius: 20px;
      border: 1px solid rgba(199,255,56,0.22);
      box-shadow: 0 24px 60px rgba(0,0,0,0.55);
      position: relative;
      text-align: center;
    }
    h2 {
      position: relative;
      color: #c7ff38;
      font-size: 24px;
      text-transform: uppercase;
      font-weight: 900;
      border-bottom: 2px solid rgba(199,255,56,0.3);
      padding-bottom: 12px;
      margin-bottom: 25px;
    }
    .auth-input {
      position: relative;
      z-index: 2;
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: #1e293b;
      color: white;
      font-size: 16px;
    }
    .auth-input:focus {
      outline: none;
      border-color: #c7ff38;
    }
    .auth-forgot-link {
      display: block;
      text-align: right;
      font-size: 12px;
      color: #9ca8c6 !important;
      font-weight: 600;
      margin: -4px 0 14px;
      text-decoration: underline !important;
      position: relative;
      z-index: 2;
    }
    .auth-forgot-link:hover { color: #c7ff38 !important; }
    .auth-error {
      position: relative;
      z-index: 2;
      display: none;
      text-align: left;
      background: rgba(248,113,113,0.12);
      border: 1px solid rgba(248,113,113,0.4);
      color: #fecaca;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 14px;
    }
    .auth-submit-btn {
      position: relative;
      z-index: 2;
      width: 100%;
      background: linear-gradient(135deg, #d9ff6e 0%, #c7ff38 55%, #a8e619 100%);
      color: #041102;
      padding: 14px;
      border-radius: 999px;
      border: 1px solid rgba(199,255,56,0.9);
      box-shadow: 0 4px 16px rgba(199,255,56,0.22);
      font-weight: 800;
      cursor: pointer;
      margin-top: 10px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .auth-submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 26px rgba(199, 255, 56, 0.45);
    }
    .auth-submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    a { color: #c7ff38; text-decoration: none; font-weight: bold; }
    .inline-switch-link {
      display: inline-flex;
      align-items: center;
      font-size: 12px;
      font-weight: 800;
      padding: 5px 14px;
      border-radius: 999px;
      text-decoration: none !important;
      margin-left: 2px;
      color: #c7ff38 !important;
      border: 1px solid rgba(199,255,56,0.4);
      background: rgba(199,255,56,0.08);
      transition: 0.2s ease;
    }
    .inline-switch-link:hover {
      border-color: rgba(199,255,56,0.8);
      background: rgba(199,255,56,0.16);
    }
    @media (max-width: 480px) {
      header { padding: 12px 16px; }
      .auth-overlay { padding: 90px 14px 30px; }
      .whiteboard-login { padding: 28px 22px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">GAME <span>OF OPINIONS</span></div>
    <nav>
      <a href="index.html">Home</a>
    </nav>
  </header>

  <div class="auth-overlay">
    <div class="whiteboard-login">
      <h2>Manager Login</h2>
      <p style="position: relative; z-index: 2; color: #cbd5e1; font-weight: 700; margin-bottom: 20px; font-size: 14px;">Winners Think Outside The Box.</p>

      <div id="loginError" class="auth-error"></div>

      <input id="email" class="auth-input" type="email" placeholder="Email Address" autocomplete="email">
      <input id="password" class="auth-input" type="password" placeholder="Password" autocomplete="current-password">
      <a href="javascript:void(0)" class="auth-forgot-link" onclick="handlePasswordReset()">Forgot password?</a>

      <button id="loginSubmitBtn" class="auth-submit-btn" onclick="handleLogin()">Log Me In</button>

      <p style="position: relative; z-index: 2; color: #cbd5e1; font-size: 12px; margin-top: 20px;">
        Need an account? <a href="signup.html" class="inline-switch-link">Sign Up</a>
      </p>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getAnalytics, logEvent } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-analytics.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBS3Fpobk342TpJw73mMgYOyUrWb-jBtfM",
      authDomain: "game-of-opinions-97b14.firebaseapp.com",
      projectId: "game-of-opinions-97b14",
      storageBucket: "game-of-opinions-97b14.firebasestorage.app",
      appId: "1:863518863234:web:3a2c2378a2a358e0b2299b",
      // TODO: paste your real Measurement ID here once Google Analytics is
      // enabled in Firebase Console (Project Settings -> Integrations), or
      // analytics will silently no-op. See ANALYTICS_SETUP.md.
      measurementId: "G-XXXXXXXXXX"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const analytics = getAnalytics(app);

    const errorEl = document.getElementById('loginError');
    const submitBtn = document.getElementById('loginSubmitBtn');

    function showLoginError(message) {
      if (!errorEl) return;
      errorEl.textContent = message;
      errorEl.style.display = message ? 'block' : 'none';
    }

    window.handleLogin = async () => {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      showLoginError('');

      if (!email || !password) {
        showLoginError('Please enter your email and password.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = 'Logging in...';

      try {
        await signInWithEmailAndPassword(auth, email, password);
        logEvent(analytics, 'login', { method: 'email' });
        window.location.href = "dashboard.html";
      } catch (error) {
        showLoginError(error.message);
        submitBtn.disabled = false;
        submitBtn.innerText = 'Log Me In';
      }
    };

    window.handlePasswordReset = async () => {
      const email = document.getElementById('email').value.trim();

      if (!email) {
        showLoginError('Enter your email address above first, then tap Forgot Password.');
        return;
      }

      try {
        await sendPasswordResetEmail(auth, email);
        showLoginError('');
        alert(`Password reset email sent to ${email}. Check your inbox (and spam folder) for a link to set a new password.`);
      } catch (error) {
        showLoginError(error.message || 'Failed to send password reset email.');
      }
    };
  </script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/service-worker.js').catch((error) => {
      console.warn('Service worker registration failed:', error);
    });
  });
  // Once a new service worker takes control, reload once so this page picks
  // up the latest app-shell instead of running a stale cached version.
  let swRefreshedOnce = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (swRefreshedOnce) return;
    swRefreshedOnce = true;
    window.location.reload();
  });
}
</script>
</body>
</html>
