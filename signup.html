<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create your GOO account and join the league.">
  <meta name="theme-color" content="#020611">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="application-name" content="GOO">
  <meta name="apple-mobile-web-app-title" content="GOO">
  <meta property="og:title" content="GOO">
  <meta property="og:image" content="icon-512.png">
  <meta name="twitter:title" content="GOO">
  <meta name="twitter:image" content="icon-512.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Sign Up - GOO</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: white;
      font-family: 'Segoe UI', Arial, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      background: url('managers office.png') no-repeat center center;
      background-size: cover;
    }
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      background: rgba(0,0,0,0.72);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,255,255,0.12);
    }
    .logo {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      text-transform: uppercase;
      line-height: 1;
    }
    .logo span { color: #c7ff38; }
    header nav a {
      color: rgba(255,255,255,0.85);
      text-decoration: none;
      font-size: 15px;
      font-weight: 700;
    }
    header nav a:hover { color: #fff; }
    .auth-overlay {
      min-height: 100vh;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 100px 20px 40px;
    }
    .whiteboard-login {
      width: 100%;
      max-width: 420px;
      background: linear-gradient(180deg, #176d2c 0%, #0f5a22 100%);
      padding: 40px;
      border-radius: 12px;
      border: 8px solid #fff;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      position: relative;
      text-align: center;
    }
    .pitch-markings::before {
      content: "";
      position: absolute;
      top: 50%; left: 0; width: 100%; height: 2px;
      background: rgba(255,255,255,0.3);
    }
    .pitch-markings::after {
      content: "";
      position: absolute;
      top: 50%; left: 50%; width: 100px; height: 100px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }
    h2 {
      position: relative;
      font-size: 24px;
      text-transform: uppercase;
      font-weight: 900;
      border-bottom: 2px solid #c7ff38;
      padding-bottom: 12px;
      margin-bottom: 25px;
    }
    .auth-input {
      position: relative;
      z-index: 2;
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: #1e293b;
      color: white;
      font-size: 16px;
    }
    .auth-input:focus {
      outline: none;
      border-color: #c7ff38;
    }
    .auth-hint {
      position: relative;
      z-index: 2;
      margin: -4px 0 14px;
      font-size: 11px;
      color: rgba(255,255,255,0.6);
      text-align: left;
    }
    .auth-error {
      position: relative;
      z-index: 2;
      display: none;
      text-align: left;
      background: rgba(248,113,113,0.12);
      border: 1px solid rgba(248,113,113,0.4);
      color: #fecaca;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 14px;
    }
    .auth-submit-btn {
      position: relative;
      z-index: 2;
      width: 100%;
      background: #c7ff38;
      color: #041102;
      padding: 14px;
      border-radius: 999px;
      border: none;
      font-weight: 800;
      cursor: pointer;
      margin-top: 10px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .auth-submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 20px rgba(199, 255, 56, 0.6);
    }
    .auth-submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    a { color: #c7ff38; text-decoration: none; font-weight: bold; }
    @media (max-width: 480px) {
      header { padding: 12px 16px; }
      .auth-overlay { padding: 90px 14px 30px; }
      .whiteboard-login { padding: 28px 22px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">GAME <span>OF OPINIONS</span></div>
    <nav>
      <a href="index.html">Home</a>
    </nav>
  </header>

  <div class="auth-overlay">
    <div class="whiteboard-login">
      <div class="pitch-markings"></div>
      <h2>Manager Registration</h2>
      <p style="position: relative; z-index: 2; font-weight: 700; margin-bottom: 20px; font-size: 14px;">Have you got what it takes?</p>

      <div id="signupError" class="auth-error"></div>

      <input id="email" class="auth-input" type="email" placeholder="Email Address" autocomplete="email">
      <input id="password" class="auth-input" type="password" placeholder="Create Password" autocomplete="new-password">
      <input id="confirmPassword" class="auth-input" type="password" placeholder="Confirm Password" autocomplete="new-password">
      <div class="auth-hint">Use at least 6 characters.</div>

      <button id="signupSubmitBtn" class="auth-submit-btn" onclick="handleSignup()">Finalise Application</button>

      <p style="position: relative; z-index: 2; font-size: 12px; margin-top: 20px;">
        Already a manager? <a href="index.html?login=true">Log In</a>
      </p>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBS3Fpobk342TpJw73mMgYOyUrWb-jBtfM",
      authDomain: "game-of-opinions-97b14.firebaseapp.com",
      projectId: "game-of-opinions-97b14",
      storageBucket: "game-of-opinions-97b14.firebasestorage.app",
      appId: "1:863518863234:web:3a2c2378a2a358e0b2299b"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const errorEl = document.getElementById('signupError');
    const submitBtn = document.getElementById('signupSubmitBtn');

    function showSignupError(message) {
      if (!errorEl) return;
      errorEl.textContent = message;
      errorEl.style.display = message ? 'block' : 'none';
    }

    window.handleSignup = async () => {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      showSignupError('');

      if (!email || !password || !confirmPassword) {
        showSignupError('Please fill in all fields.');
        return;
      }
      if (password.length < 6) {
        showSignupError('Password must be at least 6 characters.');
        return;
      }
      if (password !== confirmPassword) {
        showSignupError('Passwords do not match.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = 'Creating your account...';

      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        // Initialize user record in Firestore
        await setDoc(doc(db, "users", userCredential.user.uid), {
          email: email,
          createdAt: new Date()
        });
        window.location.href = "myxi.html";
      } catch (error) {
        showSignupError(error.message);
        submitBtn.disabled = false;
        submitBtn.innerText = 'Finalise Application';
      }
    };
  </script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/service-worker.js').catch((error) => {
      console.warn('Service worker registration failed:', error);
    });
  });
  // Once a new service worker takes control, reload once so this page picks
  // up the latest app-shell instead of running a stale cached version.
  let swRefreshedOnce = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (swRefreshedOnce) return;
    swRefreshedOnce = true;
    window.location.reload();
  });
}
</script>
</body>
</html>
