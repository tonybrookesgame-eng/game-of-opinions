<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create your GOO account and join the league.">
  <meta name="theme-color" content="#020611">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="application-name" content="GOO">
  <meta name="apple-mobile-web-app-title" content="GOO">
  <meta property="og:title" content="GOO">
  <meta property="og:image" content="icon-512.png">
  <meta name="twitter:title" content="GOO">
  <meta name="twitter:image" content="icon-512.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Sign Up - GOO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: white;
      font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      background:
        radial-gradient(circle at top, rgba(255,255,255,0.08), transparent 25%),
        linear-gradient(180deg,#020611 0%,#071320 40%,#071a29 100%);
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at center, rgba(120,255,120,0.08), transparent 40%),
        repeating-radial-gradient(circle at 50% -20%, rgba(255,255,255,0.03) 0px, transparent 80px, transparent 120px);
      pointer-events: none;
      z-index: -1;
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
      background-size: 80px 80px;
      opacity: 0.2;
      pointer-events: none;
      z-index: -1;
    }
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      background: rgba(0,0,0,0.72);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,255,255,0.12);
    }
    .logo {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      text-transform: uppercase;
      line-height: 1;
    }
    .logo span { color: #c7ff38; }
    header nav a {
      color: rgba(255,255,255,0.85);
      text-decoration: none;
      font-size: 15px;
      font-weight: 700;
    }
    header nav a:hover { color: #fff; }
    .auth-overlay {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 100px 20px 40px;
    }
    .whiteboard-login {
      width: 100%;
      max-width: 420px;
      background:
        radial-gradient(circle at 18% 0%, rgba(199,255,56,0.12), transparent 55%),
        linear-gradient(180deg, #101b2d 0%, #0a1220 100%);
      padding: 40px;
      border-radius: 20px;
      border: 1px solid rgba(199,255,56,0.22);
      box-shadow: 0 24px 60px rgba(0,0,0,0.55);
      position: relative;
      text-align: center;
    }
    h2 {
      position: relative;
      color: #c7ff38;
      font-size: 24px;
      text-transform: uppercase;
      font-weight: 900;
      border-bottom: 2px solid rgba(199,255,56,0.3);
      padding-bottom: 12px;
      margin-bottom: 25px;
    }
    .auth-input {
      position: relative;
      z-index: 2;
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: #1e293b;
      color: white;
      font-size: 16px;
    }
    .auth-input:focus {
      outline: none;
      border-color: #c7ff38;
    }
    .auth-hint {
      position: relative;
      z-index: 2;
      margin: -4px 0 14px;
      font-size: 11px;
      color: rgba(255,255,255,0.6);
      text-align: left;
    }
    .google-auth-btn {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      background: #fff;
      color: #1f1f1f;
      padding: 13px;
      border-radius: 999px;
      border: 1px solid rgba(0,0,0,0.15);
      font-weight: 700;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      margin-bottom: 18px;
      transition: box-shadow 0.2s ease, transform 0.2s ease;
    }
    .google-auth-btn:hover {
      box-shadow: 0 4px 14px rgba(0,0,0,0.25);
      transform: translateY(-1px);
    }
    .google-auth-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .google-g {
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: 700;
      font-size: 17px;
      color: #4285F4;
      line-height: 1;
    }
    .auth-divider {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 16px;
      color: #9ca8c6;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .auth-divider::before, .auth-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.14);
    }
    .auth-error {
      position: relative;
      z-index: 2;
      display: none;
      text-align: left;
      background: rgba(248,113,113,0.12);
      border: 1px solid rgba(248,113,113,0.4);
      color: #fecaca;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 14px;
    }
    .auth-submit-btn {
      position: relative;
      z-index: 2;
      width: 100%;
      background: linear-gradient(135deg, #d9ff6e 0%, #c7ff38 55%, #a8e619 100%);
      color: #041102;
      padding: 14px;
      border-radius: 999px;
      border: 1px solid rgba(199,255,56,0.9);
      box-shadow: 0 4px 16px rgba(199,255,56,0.22);
      font-weight: 800;
      cursor: pointer;
      margin-top: 10px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .auth-submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 26px rgba(199, 255, 56, 0.45);
    }
    .auth-submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    a { color: #c7ff38; text-decoration: none; font-weight: bold; }
    .inline-switch-link {
      display: inline-flex;
      align-items: center;
      font-size: 12px;
      font-weight: 800;
      padding: 5px 14px;
      border-radius: 999px;
      text-decoration: none !important;
      margin-left: 2px;
      color: #c7ff38 !important;
      border: 1px solid rgba(199,255,56,0.4);
      background: rgba(199,255,56,0.08);
      transition: 0.2s ease;
    }
    .inline-switch-link:hover {
      border-color: rgba(199,255,56,0.8);
      background: rgba(199,255,56,0.16);
    }
    @media (max-width: 480px) {
      header { padding: 12px 16px; }
      .auth-overlay { padding: 90px 14px 30px; }
      .whiteboard-login { padding: 28px 22px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">GAME <span>OF OPINIONS</span></div>
    <nav>
      <a href="index.html">Home</a>
    </nav>
  </header>

  <div class="auth-overlay">
    <div class="whiteboard-login">
      <h2>Manager Sign-Up</h2>
      <p style="position: relative; z-index: 2; color: #cbd5e1; font-weight: 700; margin-bottom: 20px; font-size: 14px;">Have you got what it takes?</p>

      <div id="signupError" class="auth-error"></div>

      <button id="googleAuthBtn" class="google-auth-btn" type="button" onclick="handleGoogleAuth()">
        <span class="google-g">G</span> Continue with Google
      </button>
      <div class="auth-divider"><span>or</span></div>

      <input id="email" class="auth-input" type="email" placeholder="Email Address" autocomplete="email">
      <input id="password" class="auth-input" type="password" placeholder="Create Password" autocomplete="new-password">
      <input id="confirmPassword" class="auth-input" type="password" placeholder="Confirm Password" autocomplete="new-password">
      <div class="auth-hint">Use at least 6 characters.</div>

      <button id="signupSubmitBtn" class="auth-submit-btn" onclick="handleSignup()">Sign Me Up</button>

      <p style="position: relative; z-index: 2; color: #cbd5e1; font-size: 12px; margin-top: 20px;">
        Already a manager? <a href="login.html" class="inline-switch-link">Log In</a>
      </p>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { getAnalytics, logEvent } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-analytics.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBS3Fpobk342TpJw73mMgYOyUrWb-jBtfM",
      authDomain: "game-of-opinions-97b14.firebaseapp.com",
      projectId: "game-of-opinions-97b14",
      storageBucket: "game-of-opinions-97b14.firebasestorage.app",
      appId: "1:863518863234:web:3a2c2378a2a358e0b2299b",
      // TODO: paste your real Measurement ID here once Google Analytics is
      // enabled in Firebase Console (Project Settings -> Integrations), or
      // analytics will silently no-op. See ANALYTICS_SETUP.md.
      measurementId: "G-XXXXXXXXXX"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const analytics = getAnalytics(app);

    // Fires once per page load, the moment someone actually starts filling
    // the form - lets us tell "viewed the sign-up page" apart from "tried to
    // sign up but gave up", which a plain page_view count can't distinguish.
    let signupStartLogged = false;
    function logSignupStarted() {
      if (signupStartLogged) return;
      signupStartLogged = true;
      logEvent(analytics, 'sign_up_started');
    }
    ['email', 'password', 'confirmPassword'].forEach((id) => {
      document.getElementById(id)?.addEventListener('focus', logSignupStarted, { once: true });
    });

    const errorEl = document.getElementById('signupError');
    const submitBtn = document.getElementById('signupSubmitBtn');

    function showSignupError(message) {
      if (!errorEl) return;
      errorEl.textContent = message;
      errorEl.style.display = message ? 'block' : 'none';
    }

    const googleBtn = document.getElementById('googleAuthBtn');

    window.handleGoogleAuth = async () => {
      logSignupStarted();
      showSignupError('');
      googleBtn.disabled = true;
      try {
        const result = await signInWithPopup(auth, new GoogleAuthProvider());
        const userRef = doc(db, "users", result.user.uid);
        const snap = await getDoc(userRef);
        const isNewUser = !snap.exists();
        if (isNewUser) {
          await setDoc(userRef, { email: result.user.email, createdAt: new Date() });
        }
        logEvent(analytics, isNewUser ? 'sign_up' : 'login', { method: 'google' });
        window.location.href = isNewUser ? "myxi.html" : "dashboard.html";
      } catch (error) {
        googleBtn.disabled = false;
        if (error.code === 'auth/popup-closed-by-user' || error.code === 'auth/cancelled-popup-request') return;
        console.error(error);
        showSignupError(error.message || 'Google sign-in failed.');
      }
    };

    window.handleSignup = async () => {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      showSignupError('');

      if (!email || !password || !confirmPassword) {
        showSignupError('Please fill in all fields.');
        return;
      }
      if (password.length < 6) {
        showSignupError('Password must be at least 6 characters.');
        return;
      }
      if (password !== confirmPassword) {
        showSignupError('Passwords do not match.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = 'Creating your account...';

      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        // Initialize user record in Firestore
        await setDoc(doc(db, "users", userCredential.user.uid), {
          email: email,
          createdAt: new Date()
        });
        logEvent(analytics, 'sign_up', { method: 'email' });
        window.location.href = "myxi.html";
      } catch (error) {
        showSignupError(error.message);
        submitBtn.disabled = false;
        submitBtn.innerText = 'Sign Me Up';
      }
    };
  </script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/service-worker.js').catch((error) => {
      console.warn('Service worker registration failed:', error);
    });
  });
  // Once a new service worker takes control, reload once so this page picks
  // up the latest app-shell instead of running a stale cached version.
  let swRefreshedOnce = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (swRefreshedOnce) return;
    swRefreshedOnce = true;
    window.location.reload();
  });
}
</script>
</body>
</html>
