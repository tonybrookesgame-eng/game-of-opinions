<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>League - Game of Opinions</title>

<style>

/* ========================= GLOBAL ========================= */

body {

  margin: 0;

  font-family: 'Segoe UI', Arial, sans-serif;

  color: white;

  background:

    radial-gradient(circle at top, rgba(255,255,255,0.08), transparent 25%),

    linear-gradient(180deg,#020611 0%,#071320 40%,#071a29 100%);

}

/* stadium glow layers */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at center, rgba(120,255,120,0.08), transparent 40%),
    repeating-radial-gradient(circle at 50% -20%, rgba(255,255,255,0.03) 0px, transparent 80px, transparent 120px);
  pointer-events: none;
  z-index: -1;
}

body::after {
  content: "";
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
  background-size: 80px 80px;
  opacity: 0.2;
  pointer-events: none;
  z-index: -1;
}

.user-only,.guest-only{display:none}

/* ========================= HEADER ========================= */

header {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  z-index: 1000;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 40px;
  background: rgba(0,0,0,0.72);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(255,255,255,0.12);
}

.logo {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.5px;
  text-transform: uppercase;
  line-height: 1;
  display: inline-block;
}

.logo span {color:#c7ff38;}

nav {
  display: flex;
  align-items: center;
  gap: 24px;
}

nav a {
  color: white;
  text-decoration:none;
  font-size: 16px;
}

nav a:hover {
  opacity: 0.8;
}

/* ========================= CONTAINER ========================= */

.container {

  max-width:1080px;

  margin:auto;

  padding:90px 40px 100px;

}

/* ========================= SEARCH BAR ========================= */
.search-bar-container {
  margin-bottom: 20px;
}
#managerSearch {
  width: 100%;
  padding: 12px 15px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.1);
  background: rgba(0,0,0,0.3);
  color: white;
  font-size: 16px;
  outline: none;
  transition: border-color 0.2s ease;
}
#managerSearch:focus {
  border-color: #c7ff38;
}

h1 {font-size:34px;margin-bottom:8px;}

.subtitle {color:#9ca3af;margin-bottom:25px;}

/* ========================= LEADERBOARD ========================= */

.leaderboard {

  background:rgba(255,255,255,0.04);

  border-radius:20px;

  overflow:hidden;

  border:1px solid rgba(255,255,255,0.08);

}

/* HEADER */

.leader-header {

  display:grid;

  grid-template-columns:60px 1fr 100px 90px;

  padding:14px 20px;

  font-size:12px;

  color:#9ca3af;

}

/* ROW */

.leader-row {

  display:grid;

  grid-template-columns:60px 1fr 100px 90px;

  align-items:center;

  padding:16px 20px;

  border-top:1px solid rgba(255,255,255,0.05);

  transition:0.2s;

  animation:fadeIn 0.4s ease;

}

@keyframes fadeIn {

  from {opacity:0; transform:translateY(10px);}

  to {opacity:1; transform:translateY(0);}

}

.leader-row:hover {

  background:rgba(255,255,255,0.06);

}

/* TOP 3 MEDALS */

.rank.gold {color:#FFD700;}

.rank.silver {color:#e2e8f0;}

.rank.bronze {color:#cd7f32;}

/* USER HIGHLIGHT */

.you {

  background:rgba(199,255,56,0.12);

  border-left:4px solid #c7ff38;

  animation:pulse 2s infinite;

}

@keyframes pulse {

  0%{box-shadow:0 0 0 rgba(199,255,56,0);}

  50%{box-shadow:0 0 10px rgba(199,255,56,0.4);}

  100%{box-shadow:0 0 0 rgba(199,255,56,0);}

}

/* TEAM CELL */

.team {

  display:flex;

  align-items:center;

  gap:10px;

  font-weight:600;

}

/* AVATAR */

.avatar {

  width:32px;

  height:32px;

  border-radius:50%;

  background:#1f2937;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:13px;

  font-weight:bold;

  color:#c7ff38;

}

/* POINTS */

.points {text-align:right;font-weight:bold;}

/* WEEKLY */

.week {

  text-align:right;

  font-size:13px;

  font-weight:600;

}

/* MOVEMENT */

.up {color:#4ade80;}

.down {color:#f87171;}

.same {color:#9ca3af;}

/* ========================= BUTTONS ========================= */

.league-actions {

  display:flex;

  gap:15px;

  margin-bottom:30px;

}

.league-btn {

  background:rgba(199,255,56,0.1);

  border:1px solid #c7ff38;

  color:#c7ff38;

  padding:10px 20px;

  border-radius:8px;

  cursor:pointer;

  font-weight:bold;

}

/* ========================= MOBILE ========================= */

.mobile-nav {
  display: none;
}

@media (max-width: 768px) {
  header {
    background: rgba(0,0,0,0.9) !important;
    justify-content: center;
    flex-direction: column;
    padding: 15px 10px;
  }
  nav {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    margin-top: 10px;
    width: 100%;
  }
  nav a {
    font-size: 11px;
    margin: 0 !important;
  }
  nav a[href="index.html"], nav a[href="myxi.html"], nav a[href="season.html"], nav a[href="league.html"] {
    display: none;
  }
  .leaderboard {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .leader-header, .leader-row {
    grid-template-columns: 45px 1fr 80px 70px;
    min-width: 400px; /* Forces alignment by providing a minimum horizontal canvas */
    padding: 12px 10px;
  }
  .team { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .avatar { width: 28px; height: 28px; font-size: 11px; }
  .points, .week { font-size: 12px; }
  .mobile-nav {
    display: flex;
    justify-content: space-around;
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: #111827;
    padding: 10px 0;
    border-top: 1px solid #333;
    z-index: 1000;
  }
  .mobile-nav a {
    text-decoration: none !important;
    color: white;
    font-size: 12px;
    text-align: center;
    margin-left: 0;
    transition: all 0.2s ease;
  }
  .mobile-nav a:hover {
    color: #c7ff38;
    transform: translateY(-3px);
    text-shadow: 0 0 15px rgba(199, 255, 56, 0.6);
  }
}

</style>

</head>

<body>

<header>
  <div class="logo">GAME <span>OF OPINIONS</span></div>
  <nav>
    <a href="index.html">Home</a>
    <a href="myxi.html" class="user-only">Your Team</a>
    <a href="season.html" class="user-only">Season Picks</a>
    <a href="league.html" class="user-only">League</a>
    <a href="rules.html" class="guest-only">Rules</a>
    <a href="javascript:void(0)" class="guest-only" onclick="location.href='index.html?login=true'">Log In</a>
    <a href="signup.html" class="guest-only">Sign Up</a>
    <a href="javascript:void(0)" class="user-only" onclick="handleLogout()">Log Out</a>
  </nav>
</header>

<div class="container">

  <h1>League Leaderboard</h1>

  <p class="subtitle">Climb. Dominate. Prove your opinions.</p>

  <div class="search-bar-container">
    <input type="text" id="managerSearch" placeholder="Search manager..." onkeyup="filterLeaderboard()">
  </div>

  <div class="league-actions user-only">

    <button class="league-btn" onclick="createLeague()">+ Create League</button>

    <button class="league-btn" onclick="joinLeague()">Join League</button>

  </div>

  <div class="leaderboard">

    <div class="leader-header">

      <div>#</div>

      <div>Team</div>

      <div style="text-align:right;">Points</div>

      <div style="text-align:right;">Week</div>

    </div>

    <div id="leaderboard-body"></div>

  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import { getFirestore, collection, query, orderBy, getDocs, doc, setDoc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {

  apiKey: "AIzaSyBS3Fpobk342TpJw73mMgYOyUrWb-jBtfM",

  authDomain: "game-of-opinions-97b14.firebaseapp.com",

  projectId: "game-of-opinions-97b14",

  appId: "1:863518863234:web:3a2c2378a2a358e0b2299b"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const auth = getAuth(app);

let allLeaderboardData = []; // Global variable to store all leaderboard data

/* LOAD LEADERBOARD */

async function loadLeaderboard(user){

  const body = document.getElementById("leaderboard-body");

  body.innerHTML = "Loading...";

  const q = query(collection(db,"leaderboard"), orderBy("totalPoints","desc"));

  const snap = await getDocs(q);
  
  allLeaderboardData = snap.docs; // Store all data for filtering
  filterLeaderboard(user); // Call filter function to display initially
}

  body.innerHTML="";

  let rank=1;

  snap.forEach(docSnap=>{

    const data = docSnap.data();

    const isYou = user && docSnap.id === user.uid;

    let medalClass="";

    let medalIcon=rank;

    if(rank===1){medalClass="gold"; medalIcon="🥇";}

    if(rank===2){medalClass="silver"; medalIcon="🥈";}

    if(rank===3){medalClass="bronze"; medalIcon="🥉";}

    const weekly = data.weeklyPoints || 0;

    const changeClass = weekly>0 ? "up" : weekly<0 ? "down" : "same";

    const arrow = weekly>0 ? "⬆️" : weekly<0 ? "⬇️" : "—";

    const initials = (data.teamName || "A")

      .split(" ")

      .map(w=>w[0])

      .join("")

      .substring(0,2)

      .toUpperCase();

    const row=document.createElement("div");

    row.className = `leader-row ${isYou ? "you" : ""}`;

    row.innerHTML=`

      <div class="rank ${medalClass}">${medalIcon}</div>

      <div class="team">

        <div class="avatar">${initials}</div>

        ${data.teamName || "Anonymous"} ${isYou?"(You)":""}

      </div>

      <div class="points">${data.totalPoints || 0}</div>

      <div class="week ${changeClass}">

        ${weekly>0?"+":""}${weekly} ${arrow}

      </div>

    `;

    body.appendChild(row);

    rank++;

  });

}

function filterLeaderboard(user = auth.currentUser) {
  const body = document.getElementById("leaderboard-body");
  body.innerHTML = "";
  const searchTerm = document.getElementById('managerSearch').value.toLowerCase();

  let rank = 1;
  allLeaderboardData.forEach(docSnap => {
    const data = docSnap.data();
    const teamName = data.teamName || "Anonymous";

    if (teamName.toLowerCase().includes(searchTerm)) {
      const isYou = user && docSnap.id === user.uid;
      let medalClass = "";
      let medalIcon = rank;
      if (rank === 1) { medalClass = "gold"; medalIcon = "🥇"; }
      if (rank === 2) { medalClass = "silver"; medalIcon = "🥈"; }
      if (rank === 3) { medalClass = "bronze"; medalIcon = "🥉"; }

      const weekly = data.weeklyPoints || 0;
      const changeClass = weekly > 0 ? "up" : weekly < 0 ? "down" : "same";
      const arrow = weekly > 0 ? "⬆️" : weekly < 0 ? "⬇️" : "—";

      const initials = (teamName)
        .split(" ")
        .map(w => w[0])
        .join("")
        .substring(0, 2)
        .toUpperCase();

      const row = document.createElement("div");
      row.className = `leader-row ${isYou ? "you" : ""}`;
      row.innerHTML = `
        <div class="rank ${medalClass}">${medalIcon}</div>
        <div class="team">
          <div class="avatar">${initials}</div>
          ${teamName} ${isYou ? "(You)" : ""}
        </div>
        <div class="points">${data.totalPoints || 0}</div>
        <div class="week ${changeClass}">
          ${weekly > 0 ? "+" : ""}${weekly} ${arrow}
        </div>
      `;
      body.appendChild(row);
      rank++;
    }
  });
}
window.filterLeaderboard = filterLeaderboard; // Make it globally accessible for onkeyup

window.createLeague = async ()=>{

  const name=prompt("League name:");

  if(!name) return;

  const code=Math.random().toString(36).substring(2,8).toUpperCase();

  await setDoc(doc(db,"leagues","L-"+code),{

    name,code,

    creator:auth.currentUser.uid,

    members:[auth.currentUser.uid]

  });

  alert("Code: "+code);

};

window.joinLeague = async ()=>{

  const code=prompt("Enter code:");

  if(!code) return;

  await updateDoc(doc(db,"leagues","L-"+code),{

    members:arrayUnion(auth.currentUser.uid)

  });

  alert("Joined!");

};

onAuthStateChanged(auth,(user)=>{
  const userLinks = document.querySelectorAll('.user-only');
  const guestLinks = document.querySelectorAll('.guest-only');
  if (user) {
    userLinks.forEach(l => l.style.display = 'inline-block');
    guestLinks.forEach(l => l.style.display = 'none');
  } else {
    userLinks.forEach(l => l.style.display = 'none');
    guestLinks.forEach(l => l.style.display = 'inline-block');
  }
  loadLeaderboard(user);
});

window.handleLogout = () => {
  signOut(auth).then(() => {
    window.location.href = "index.html";
  });
};

</script>

<!-- FOOTER -->
<!-- MOBILE NAV -->
<div class="mobile-nav">
  <a href="index.html">🏠<br>Home</a>
  <a href="myxi.html">⚽<br>Team</a>
  <a href="season.html">🏆<br>Picks</a>
  <a href="league.html">📊<br>League</a>
</div>

</body>

</html>
