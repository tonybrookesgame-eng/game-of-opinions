<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="View the live leaderboard and see how your Game of Opinions picks stack up against the competition.">
<meta name="theme-color" content="#020611">
<title>League - Game of Opinions</title>

<style>

/* ========================= GLOBAL ========================= */

* { box-sizing: border-box; }

body {

  margin: 0;

  overflow-x: hidden;

  font-family: 'Segoe UI', Arial, sans-serif;

  color: white;

  background:

    radial-gradient(circle at top, rgba(255,255,255,0.08), transparent 25%),

    linear-gradient(180deg,#020611 0%,#071320 40%,#071a29 100%);

}

/* stadium glow layers */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at center, rgba(120,255,120,0.08), transparent 40%),
    repeating-radial-gradient(circle at 50% -20%, rgba(255,255,255,0.03) 0px, transparent 80px, transparent 120px);
  pointer-events: none;
  z-index: -1;
}

body::after {
  content: "";
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
  background-size: 80px 80px;
  opacity: 0.2;
  pointer-events: none;
  z-index: -1;
}

.user-only,.guest-only{display:none}

/* ========================= HEADER ========================= */

header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 1000;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding: 15px 30px;
  background: rgba(0,0,0,0.72);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(255,255,255,0.12);
}

.logo {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.5px;
  text-transform: uppercase;
  line-height: 1;
  display: inline-block;
}

.logo span {color:#c7ff38;}

nav {
  display: flex;
  align-items: center;
  gap: 32px;
}

nav a {
  color: white;
  text-decoration:none;
  font-size: 16px;
}

nav a:hover {
  opacity: 0.8;
}

/* ========================= CONTAINER ========================= */

.container {

  max-width:1080px;

  margin:auto;

  padding: 90px 30px 100px;

}


h1 {font-size:34px;margin-bottom:8px;}

.subtitle {color:#9ca3af;margin-bottom:25px;}

/* ========================= LEADERBOARD ========================= */

.leaderboard {

  background:rgba(255,255,255,0.04);

  border-radius:20px;

  overflow:hidden;

  border:1px solid rgba(255,255,255,0.08);

}

/* HEADER */

.leader-header {

  display:grid;

  grid-template-columns: 60px 1fr 100px 100px 100px;

  padding: 16px 20px;

  font-size:12px;

  color:#9ca3af;

}

/* ROW */

.leader-row {

  display:grid;

  grid-template-columns: 60px 1fr 100px 100px 100px;

  align-items:center;

  padding:16px 20px;

  border-top:1px solid rgba(255,255,255,0.05);

  transition:0.2s;

  animation:fadeIn 0.4s ease;

}

@keyframes fadeIn {

  from {opacity:0; transform:translateY(10px);}

  to {opacity:1; transform:translateY(0);}

}

.leader-row:hover {

  background:rgba(255,255,255,0.06);

}

/* TOP 3 MEDALS */

.rank.gold {color:#FFD700;}

.rank.silver {color:#e2e8f0;}

.rank.bronze {color:#cd7f32;}

/* USER HIGHLIGHT */

.you {

  background:rgba(199,255,56,0.12);

  border-left:4px solid #c7ff38;

  animation:pulse 2s infinite;

}

@keyframes pulse {

  0%{box-shadow:0 0 0 rgba(199,255,56,0);}

  50%{box-shadow:0 0 10px rgba(199,255,56,0.4);}

  100%{box-shadow:0 0 0 rgba(199,255,56,0);}

}

/* TEAM CELL */

.team {
  font-weight: 600;
}

/* POINTS */

.points {text-align:right;font-weight:bold;}

/* WEEKLY */

.week {

  text-align:right;

  font-size:13px;

  font-weight:600;

}

/* MOVEMENT */

.up {color:#4ade80;}

.down {color:#f87171;}

.same {color:#9ca3af;}

/* ========================= BUTTONS ========================= */

.league-actions {
  display:flex;
  gap:15px;
  margin-bottom:24px;
  flex-wrap:wrap;
  align-items:center;
}

.league-input-row {
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  align-items:center;
}

.league-input {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.12);
  color: white;
  border-radius: 999px;
  padding: 10px 14px;
  min-width: 200px;
  outline: none;
}

.league-btn {
  background:rgba(199,255,56,0.1);
  border:1px solid #c7ff38;
  color:#c7ff38;
  padding:10px 20px;
  border-radius:999px;
  cursor:pointer;
  font-weight:bold;
}

.league-btn.secondary {
  background: rgba(255,255,255,0.08);
  color: white;
  border: 1px solid rgba(255,255,255,0.12);
}

.league-status {
  display:none;
  margin: 0 0 24px;
  padding: 16px;
  border-radius: 16px;
  background: rgba(199,255,56,0.08);
  border: 1px solid rgba(199,255,255,0.2);
}

.league-status h3 {
  margin: 0 0 6px;
  color: #c7ff38;
  font-size: 16px;
}

.league-status p {
  margin: 0 0 10px;
  color: #cbd5e1;
  font-size: 14px;
}

.league-code-pill {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: rgba(0,0,0,0.25);
  border: 1px solid rgba(255,255,255,0.12);
  padding: 8px 12px;
  border-radius: 999px;
  font-weight: 800;
  letter-spacing: 0.08em;
  margin-bottom: 10px;
}

.league-status-actions {
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

/* ========================= MOBILE ========================= */

.mobile-nav {
  display: none;
}

@media (max-width: 768px) {
  header {
    background: rgba(0,0,0,0.9) !important;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    padding: 15px 10px;
    height: auto;
  }
  nav {
    display: none;
  }

  /* LEADERBOARD MOBILE OPTIMIZATION */
  .leaderboard {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .container {
    padding-left: 10px;
    padding-right: 10px;
  }
  .leader-header, .leader-row {
    grid-template-columns: 25px 85px 50px 50px 70px;
    min-width: 0;
    padding: 10px 5px;
    font-size: 11px; /* Smaller text for better visibility */
  }
  .leader-row .team {
    font-size: 10px;
  }
  /* Sticky Columns Logic */
  .leader-header div:nth-child(1), .leader-row .rank {
    position: sticky;
    left: 0;
    z-index: 5;
    background: #07101a; /* Solid background to cover scrolling content */
  }
  .leader-header div:nth-child(2), .leader-row .team {
    position: sticky;
    left: 30px;
    z-index: 5;
    background: #07101a;
    border-right: 1px solid rgba(255,255,255,0.05);
  }
  /* Ensure user highlight persists over sticky background */
  .leader-row.you .rank, .leader-row.you .team {
    background: #122114 !important;
  }

  .change-arrow {
    font-size: 9px;
  }

  .mobile-nav {
    display: flex;
    justify-content: space-around;
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: #000;
    padding: 10px 0;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    z-index: 1000;
  }
  .mobile-nav a {
    text-decoration: none !important;
    color: white;
    font-size: 12px;
    text-align: center;
    margin-left: 0;
    transition: all 0.2s ease;
  }
  .mobile-nav a:hover {
    color: #c7ff38;
    transform: translateY(-3px);
    text-shadow: 0 0 15px rgba(199, 255, 56, 0.6);
  }
}

</style>

</head>

<body>

<header>
  <div class="logo">GAME <span>OF OPINIONS</span></div>
  <nav>
    <a href="index.html">Home</a>
    <a href="myxi.html" class="user-only">Your Team</a>
    <a href="season.html" class="user-only">Season Picks</a>
    <a href="league.html" class="user-only">League</a>
    <a href="rules.html" class="guest-only">Rules</a>
    <a href="javascript:void(0)" class="guest-only" onclick="location.href='index.html?login=true'">Log In</a>
    <a href="signup.html" class="guest-only">Sign Up</a>
    <a href="javascript:void(0)" class="user-only" onclick="handleLogout()">Log Out</a>
  </nav>
</header>

<div class="container">

  <h1>League Table</h1>

  <p class="subtitle">Climb. Dominate. Prove your opinions.</p>

  <div class="league-actions user-only">
    <div class="league-input-row">
      <input id="league-name-input" class="league-input" placeholder="League name" />
      <button class="league-btn" onclick="createLeague()">+ Create League</button>
    </div>
    <div class="league-input-row">
      <input id="join-code-input" class="league-input" placeholder="Enter league code" />
      <button class="league-btn" onclick="joinLeague()">Join League</button>
    </div>
  </div>

  <div id="league-status" class="league-status">
    <h3 id="league-status-title">League ready</h3>
    <p id="league-status-text">Share this code with friends.</p>
    <div class="league-code-pill">
      <span id="league-code-display">--</span>
    </div>
    <div class="league-status-actions">
      <button class="league-btn secondary" onclick="copyLeagueCode()">Copy Code</button>
      <button class="league-btn secondary" onclick="shareLeagueCode()">Share</button>
    </div>
  </div>

  <div class="leaderboard">

    <div class="leader-header">

      <div>#</div>

      <div>Team</div>

      <div style="text-align:right;">Season</div>

      <div style="text-align:right;">Week</div>

      <div style="text-align:right;">Total</div>

    </div>

    <div id="leaderboard-body"></div>

  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import { getFirestore, collection, query, orderBy, getDocs, getDoc, doc, setDoc, updateDoc, arrayUnion, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {

  apiKey: "AIzaSyBS3Fpobk342TpJw73mMgYOyUrWb-jBtfM",

  authDomain: "game-of-opinions-97b14.firebaseapp.com",

  projectId: "game-of-opinions-97b14",

  appId: "1:863518863234:web:3a2c2378a2a358e0b2299b"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const auth = getAuth(app);

/* LOAD LEADERBOARD */

async function loadLeaderboard(user){

  const body = document.getElementById("leaderboard-body");

  body.innerHTML = "Loading...";

  const q = query(collection(db,"leaderboard"), orderBy("totalPoints","desc"));

  const snap = await getDocs(q);

  body.innerHTML="";

  let rank=1;

  snap.forEach(docSnap=>{

    const data = docSnap.data();

    const isYou = user && docSnap.id === user.uid;

    let medalClass="";

    let medalIcon=rank;

    if(rank===1){medalClass="gold"; medalIcon="🥇";}

    if(rank===2){medalClass="silver"; medalIcon="🥈";}

    if(rank===3){medalClass="bronze"; medalIcon="🥉";}

    const weekly = data.weeklyPoints || 0;
    const season = data.seasonPoints || 0;

    const changeClass = weekly>0 ? "up" : weekly<0 ? "down" : "same";

    const arrow = weekly>0 ? "⬆️" : weekly<0 ? "⬇️" : "—";

    const teamName = data.teamName || "Anonymous";
    const isMobile = window.innerWidth <= 768;
    const isTruncated = isMobile && teamName.length > 25;
    const displayTeamName = isTruncated ? teamName.substring(0, 25) + "..." : teamName;
    const escapedName = teamName.replace(/'/g, "\\'");

    const row=document.createElement("div");    row.className = `leader-row ${isYou ? "you" : ""}`;

    row.innerHTML=`

      <div class="rank ${medalClass}">${medalIcon}</div>

      <div class="team" ${isTruncated ? `onclick="alert('${escapedName}')" style="cursor:help;"` : ""}>
        <span title="${teamName}">${displayTeamName}</span> ${isYou?"(You)":""}

      </div>

      <div class="points">${season}</div>

      <div class="week ${changeClass}">

        ${weekly>0?"+":""}${weekly} <span class="change-arrow">${arrow}</span>

      </div>

      <div class="points" style="font-weight: 900; color: #c7ff38;">${data.totalPoints || 0}</div>

    `;

    body.appendChild(row);

    rank++;

  });

}

let activeLeagueCode = "";
let activeLeagueName = "";

function showLeagueStatus(title, message, code) {
  const panel = document.getElementById("league-status");
  const titleEl = document.getElementById("league-status-title");
  const textEl = document.getElementById("league-status-text");
  const codeEl = document.getElementById("league-code-display");

  titleEl.innerText = title;
  textEl.innerText = message;
  codeEl.innerText = code || "--";
  panel.style.display = "block";

  activeLeagueCode = code || "";
}

async function copyLeagueCode() {
  if (!activeLeagueCode) return;

  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(activeLeagueCode);
    } else {
      const temp = document.createElement("textarea");
      temp.value = activeLeagueCode;
      document.body.appendChild(temp);
      temp.select();
      document.execCommand("copy");
      document.body.removeChild(temp);
    }
    alert(`League code copied: ${activeLeagueCode}`);
  } catch (err) {
    console.error(err);
    alert("Unable to copy automatically. Please copy the code manually.");
  }
}

async function shareLeagueCode() {
  if (!activeLeagueCode) return;

  const shareText = `Join my Game of Opinions league with code ${activeLeagueCode}`;

  try {
    if (navigator.share) {
      await navigator.share({
        title: "Game of Opinions League",
        text: shareText
      });
    } else {
      await copyLeagueCode();
      alert(`Share this code: ${activeLeagueCode}`);
    }
  } catch (err) {
    console.error(err);
  }
}

window.copyLeagueCode = copyLeagueCode;
window.shareLeagueCode = shareLeagueCode;

window.createLeague = async ()=>{
  const nameInput = document.getElementById("league-name-input");
  const name = (nameInput?.value || "").trim();

  if (!name) {
    alert("Please enter a league name.");
    return;
  }

  let code = "";
  let attempts = 0;

  while (attempts < 10) {
    code = Math.random().toString(36).substring(2, 8).toUpperCase();
    const existing = await getDoc(doc(db, "leagues", "L-" + code));
    if (!existing.exists()) break;
    attempts++;
  }

  if (!code) {
    alert("Unable to create a league right now. Please try again.");
    return;
  }

  await setDoc(doc(db, "leagues", "L-" + code), {
    name,
    code,
    creator: auth.currentUser.uid,
    members: [auth.currentUser.uid]
  });

  nameInput.value = "";
  showLeagueStatus("League created", `Share this code with your friends to join ${name}.`, code);
};

window.joinLeague = async ()=>{
  const input = document.getElementById("join-code-input");
  const code = (input?.value || "").trim().toUpperCase();

  if (!code) {
    alert("Please enter a league code.");
    return;
  }

  const leagueRef = doc(db, "leagues", "L-" + code);
  const leagueSnap = await getDoc(leagueRef);

  if (!leagueSnap.exists()) {
    alert("League code not found. Please check the code and try again.");
    return;
  }

  const leagueData = leagueSnap.data();
  if (leagueData.members && leagueData.members.includes(auth.currentUser.uid)) {
    alert("You are already in this league.");
    return;
  }

  await updateDoc(leagueRef, {
    members: arrayUnion(auth.currentUser.uid)
  });

  input.value = "";
  showLeagueStatus("Joined league", `You joined ${leagueData.name || "the league"}.`, code);
};

onAuthStateChanged(auth,(user)=>{
  const userLinks = document.querySelectorAll('.user-only');
  const guestLinks = document.querySelectorAll('.guest-only');
  if (user) {
    userLinks.forEach(l => l.style.display = 'inline-block');
    guestLinks.forEach(l => l.style.display = 'none');
  } else {
    userLinks.forEach(l => l.style.display = 'none');
    guestLinks.forEach(l => l.style.display = 'inline-block');
  }
  loadLeaderboard(user);
});

window.handleLogout = () => {
  signOut(auth).then(() => {
    window.location.href = "index.html";
  });
};

</script>

</body>
